<!doctype html>
<html lang="uz">
  <body
    style="
      margin: 0;
      background: #f3f6fa;
      font-family: Arial, sans-serif;
      color: #092b53;
      padding: 32px 16px;
    "
  >
    <main
      style="
        max-width: 460px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 32px;
      "
    >
      <h1 style="font-size: 26px; margin: 0 0 16px">O‘qi</h1>
      <h2 style="font-size: 20px">Kirishni tasdiqlash kodi</h2>
      <p>Ilovaga qayting va quyidagi bir martalik kodni kiriting:</p>
      <p
        style="
          font-size: 32px;
          font-weight: bold;
          letter-spacing: 6px;
          background: #fff5d4;
          padding: 20px;
          border-radius: 12px;
          text-align: center;
        "
      >
        {{ .Token }}
      </p>
      <p>Kod qisqa muddat amal qiladi. Uni boshqa odamlarga bermang.</p>
      <p style="font-size: 13px; color: #64748b">
        Bu kirishni siz so‘ramagan bo‘lsangiz, xatga javob berishingiz shart
        emas.
      </p>
    </main>
  </body>
</html>
