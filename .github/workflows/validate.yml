name: Validate Oqi
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_BACKEND_MODE: demo
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:edge
      - run: npm test
      - run: npm run test:postgres
      - run: npm run supabase:check
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: npm run export:all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
